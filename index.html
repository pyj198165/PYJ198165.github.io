<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 这行代码确保网站在手机上也能正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
    <!-- 深色模式切换脚本 -->
<script>
    const themeToggle = document.getElementById('themeToggle');
    // 检查本地存储的主题偏好
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme');
        themeToggle.textContent = '☀️';
    } else if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark-theme');
        themeToggle.textContent = '🌙';
    }

    // 切换主题
    themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark-theme');
        const isDark = document.documentElement.classList.contains('dark-theme');
        themeToggle.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
</script>
<body>
    <!-- 深色模式切换按钮 -->
<button class="theme-toggle" id="themeToggle">🌙</button>
    <div class="container">
        <!-- 头像和名字 -->
        <div class="header">
            <img src="https://github.com/pyj198165/PYJ198165.github.io/blob/main/39be4edc34beb4571d8d9c2c603261d3.jpg" alt="头像" class="avatar">
            <h1>长庆物探286队爆炸班</h1>
            <p class="bio">长庆物探 286 队爆炸班，是东方物探长庆物探分公司承担黄土塬、山地、过渡带等复杂地表油气勘探任务的核心激发班组，以高日效、严安全、精操作著称，是鄂尔多斯盆地油气勘探的 “地下 CT 激发手”。</p>
        </div>

        <!-- 导航链接 -->
        <div class="links">
            <a href="#" class="link-item">关于我</a>
            <a href="#" class="link-item">我的作品</a>
            <a href="#" class="link-item">技术博客</a>
            <a href="mailto:your-email@example.com" class="link-item">联系我</a>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>© 2025 由 GitHub Pages 强力驱动</p>
        </div>
    </div>
</body>

</html>
