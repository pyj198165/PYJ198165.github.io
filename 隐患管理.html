<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐患管理系统</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 14px;
        }
        .danger-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .danger-table th, .danger-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }
        .danger-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        /* 按钮样式 */
        .action-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn:hover {
            background-color: #45a049;
        }
        .admin-btn {
            background-color: #2196F3;
            margin-bottom: 10px;
        }
        /* 照片预览样式（D列整改前照片） */
        .pre-repair-photo {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        /* 隐藏元素 */
        .hidden {
            display: none !important;
        }
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
        .close-modal {
            float: right;
            font-size: 20px;
            cursor: pointer;
        }
        .form-group {
            margin: 15px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>长庆物探286队隐患管理表</h2>
    
    <!-- 管理员登录按钮 -->
    <button class="action-btn admin-btn" id="adminLoginBtn">管理员登录</button>
    
    <!-- 管理员操作区（默认隐藏） -->
    <div id="adminActions" class="hidden">
        <button class="action-btn admin-btn" id="addHazardBtn">新增隐患（含整改前照片）</button>
    </div>

    <!-- 隐患表格 -->
    <table class="danger-table" id="hazardTable">
        <thead>
            <tr>
                <th>序号</th>
                <th>班组（A列）</th>
                <th>隐患问题（B列）</th>
                <th>整改要求（C列）</th>
                <th>整改前照片（D列）</th> <!-- 管理员预设 -->
                <th>整改人签字</th>
                <th>整改后照片</th>
                <th>整改状态</th>
            </tr>
        </thead>
        <tbody id="hazardTableBody">
            <!-- 示例数据（管理员预设整改前照片） -->
            <tr data-id="1" data-team="爆炸班" data-status="pending">
                <td>1</td>
                <td>爆炸班（A2）</td>
                <td>民爆物品领用时未双人核对数量</td>
                <td>严格执行双人双锁制度，领用前必须双人核对清单与实物数量</td>
                <td>
                    <!-- 管理员预设的整改前照片 -->
                    <img src="" class="pre-repair-photo" id="prePhoto1">
                    <!-- 管理员编辑按钮（默认隐藏） -->
                    <button class="action-btn hidden admin-edit-photo" data-id="1">更换整改前照片</button>
                    <input type="file" accept="image/*" class="hidden photo-input" id="prePhotoInput1">
                </td>
                <td>
                    <button class="action-btn signature-btn" data-id="1">签字</button>
                    <div id="signature1"></div>
                </td>
                <td>
                    <button class="action-btn upload-btn" data-id="1">上传整改后照片</button>
                    <input type="file" accept="image/*" capture="camera" class="hidden photo-input" id="postPhotoInput1">
                    <div id="postPhotoPreview1"></div>
                </td>
                <td id="status1">待整改</td>
            </tr>
        </tbody>
    </table>

    <!-- 管理员登录模态框 -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeLoginModal">&times;</span>
            <h3>管理员登录</h3>
            <div class="form-group">
                <label for="adminPwd">管理员密码：</label>
                <input type="password" id="adminPwd" placeholder="默认密码：admin123">
            </div>
            <button class="action-btn" id="doAdminLogin">登录</button>
        </div>
    </div>

    <!-- 新增隐患模态框 -->
    <div class="modal" id="addHazardModal">
        <div class="modal-content">
            <span class="close-modal" id="closeAddModal">&times;</span>
            <h3>新增隐患（管理员）</h3>
            <div class="form-group">
                <label for="newTeam">班组：</label>
                <select id="newTeam">
                    <option value="爆炸班">爆炸班</option>
                    <option value="钻井班">钻井班</option>
                    <option value="测量班">测量班</option>
                    <option value="仪器班">仪器班</option>
                </select>
            </div>
            <div class="form-group">
                <label for="newProblem">隐患问题：</label>
                <textarea id="newProblem" rows="2" placeholder="请输入隐患问题"></textarea>
            </div>
            <div class="form-group">
                <label for="newRequirement">整改要求：</label>
                <textarea id="newRequirement" rows="2" placeholder="请输入整改要求"></textarea>
            </div>
            <div class="form-group">
                <label for="newPrePhoto">整改前照片（必填）：</label>
                <input type="file" accept="image/*" id="newPrePhoto">
                <div id="newPrePhotoPreview"></div>
            </div>
            <button class="action-btn" id="saveNewHazard">保存</button>
        </div>
    </div>

    <script>
        // 全局变量
        let isAdmin = false; // 是否管理员登录
        let nextDataId = 2; // 下一个隐患ID
        const ADMIN_PASSWORD = "admin123"; // 管理员默认密码

        // -------------------------- 管理员登录逻辑 --------------------------
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminLoginModal = document.getElementById('adminLoginModal');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const doAdminLogin = document.getElementById('doAdminLogin');
        const adminPwd = document.getElementById('adminPwd');
        const adminActions = document.getElementById('adminActions');

        // 打开登录模态框
        adminLoginBtn.addEventListener('click', () => {
            adminLoginModal.style.display = 'block';
        });

        // 关闭登录模态框
        closeLoginModal.addEventListener('click', () => {
            adminLoginModal.style.display = 'none';
        });

        // 管理员登录验证
        doAdminLogin.addEventListener('click', () => {
            if (adminPwd.value === ADMIN_PASSWORD) {
                isAdmin = true;
                adminLoginModal.style.display = 'none';
                adminLoginBtn.textContent = '已登录（管理员）';
                adminActions.classList.remove('hidden'); // 显示管理员操作区
                // 显示所有整改前照片的编辑按钮
                document.querySelectorAll('.admin-edit-photo').forEach(btn => {
                    btn.classList.remove('hidden');
                });
                alert('管理员登录成功！可新增隐患、修改整改前照片');
            } else {
                alert('密码错误！默认密码：admin123');
            }
        });

        // -------------------------- 新增隐患（管理员） --------------------------
        const addHazardBtn = document.getElementById('addHazardBtn');
        const addHazardModal = document.getElementById('addHazardModal');
        const closeAddModal = document.getElementById('closeAddModal');
        const saveNewHazard = document.getElementById('saveNewHazard');
        const newPrePhoto = document.getElementById('newPrePhoto');
        const newPrePhotoPreview = document.getElementById('newPrePhotoPreview');
        const hazardTableBody = document.getElementById('hazardTableBody');

        // 打开新增隐患模态框
        addHazardBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            addHazardModal.style.display = 'block';
        });

        // 关闭新增隐患模态框
        closeAddModal.addEventListener('click', () => {
            addHazardModal.style.display = 'none';
            // 清空表单
            document.getElementById('newTeam').value = '爆炸班';
            document.getElementById('newProblem').value = '';
            document.getElementById('newRequirement').value = '';
            newPrePhoto.value = '';
            newPrePhotoPreview.innerHTML = '';
        });

        // 预览新增隐患的整改前照片（管理员）
        newPrePhoto.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) {
                alert('请选择有效的图片文件');
                newPrePhoto.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                newPrePhotoPreview.innerHTML = `<img src="${e.target.result}" class="pre-repair-photo">`;
            };
            reader.readAsDataURL(file);
        });

        // 保存新增隐患（含管理员上传的整改前照片）
        saveNewHazard.addEventListener('click', () => {
            const team = document.getElementById('newTeam').value;
            const problem = document.getElementById('newProblem').value.trim();
            const requirement = document.getElementById('newRequirement').value.trim();
            const prePhotoFile = newPrePhoto.files[0];

            if (!problem || !requirement || !prePhotoFile) {
                alert('请填写完整信息并上传整改前照片！');
                return;
            }

            // 读取整改前照片
            const reader = new FileReader();
            reader.onload = (e) => {
                // 创建新行
                const newRow = document.createElement('tr');
                newRow.dataset.id = nextDataId;
                newRow.dataset.team = team;
                newRow.dataset.status = 'pending';
                newRow.innerHTML = `
                    <td>${nextDataId}</td>
                    <td>${team}</td>
                    <td>${problem}</td>
                    <td>${requirement}</td>
                    <td>
                        <img src="${e.target.result}" class="pre-repair-photo" id="prePhoto${nextDataId}">
                        <button class="action-btn admin-edit-photo" data-id="${nextDataId}">更换整改前照片</button>
                        <input type="file" accept="image/*" class="hidden photo-input" id="prePhotoInput${nextDataId}">
                    </td>
                    <td>
                        <button class="action-btn signature-btn" data-id="${nextDataId}">签字</button>
                        <div id="signature${nextDataId}"></div>
                    </td>
                    <td>
                        <button class="action-btn upload-btn" data-id="${nextDataId}">上传整改后照片</button>
                        <input type="file" accept="image/*" capture="camera" class="hidden photo-input" id="postPhotoInput${nextDataId}">
                        <div id="postPhotoPreview${nextDataId}"></div>
                    </td>
                    <td id="status${nextDataId}">待整改</td>
                `;

                // 添加到表格
                hazardTableBody.appendChild(newRow);

                // 绑定新行的整改前照片编辑事件（管理员）
                bindPrePhotoEditEvent(nextDataId);
                // 绑定整改后照片上传事件
                bindPostPhotoUploadEvent(nextDataId);
                // 绑定签字事件
                bindSignatureEvent(nextDataId);

                // 关闭模态框并清空表单
                addHazardModal.style.display = 'none';
                document.getElementById('newTeam').value = '爆炸班';
                document.getElementById('newProblem').value = '';
                document.getElementById('newRequirement').value = '';
                newPrePhoto.value = '';
                newPrePhotoPreview.innerHTML = '';

                nextDataId++;
                alert('新增隐患成功！整改前照片已保存');
            };
            reader.readAsDataURL(prePhotoFile);
        });

        // -------------------------- 整改前照片编辑（仅管理员） --------------------------
        function bindPrePhotoEditEvent(dataId) {
            const editBtn = document.querySelector(`.admin-edit-photo[data-id="${dataId}"]`);
            const prePhotoInput = document.getElementById(`prePhotoInput${dataId}`);
            const prePhotoImg = document.getElementById(`prePhoto${dataId}`);

            if (!editBtn || !prePhotoInput || !prePhotoImg) return;

            // 点击编辑按钮打开文件选择框
            editBtn.addEventListener('click', () => {
                if (!isAdmin) return;
                prePhotoInput.click();
            });

            // 更换整改前照片
            prePhotoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) {
                    alert('请选择有效的图片文件');
                    prePhotoInput.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    prePhotoImg.src = e.target.result;
                    alert('整改前照片更换成功！');
                };
                reader.readAsDataURL(file);
            });
        }

        // 初始化已有行的整改前照片编辑事件
        bindPrePhotoEditEvent(1);

        // -------------------------- 整改后照片上传（普通用户/管理员） --------------------------
        function bindPostPhotoUploadEvent(dataId) {
            const uploadBtn = document.querySelector(`.upload-btn[data-id="${dataId}"]`);
            const postPhotoInput = document.getElementById(`postPhotoInput${dataId}`);
            const postPhotoPreview = document.getElementById(`postPhotoPreview${dataId}`);
            const statusElement = document.getElementById(`status${dataId}`);

            if (!uploadBtn || !postPhotoInput || !postPhotoPreview) return;

            // 点击上传按钮
            uploadBtn.addEventListener('click', () => {
                postPhotoInput.click();
            });

            // 上传整改后照片
            postPhotoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) {
                    alert('请选择有效的图片文件');
                    postPhotoInput.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    postPhotoPreview.innerHTML = `<img src="${e.target.result}" class="pre-repair-photo">`;
                    // 检查是否已签字
                    const signatureDiv = document.getElementById(`signature${dataId}`);
                    if (signatureDiv.children.length > 0) {
                        statusElement.textContent = '已完成';
                        statusElement.style.color = 'green';
                        document.querySelector(`tr[data-id="${dataId}"]`).dataset.status = 'completed';
                        alert('整改完成！状态已更新为「已完成」');
                    } else {
                        alert('整改后照片上传成功，请完成整改人签字！');
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // 初始化已有行的整改后照片上传事件
        bindPostPhotoUploadEvent(1);

        // -------------------------- 整改人签字 --------------------------
        function bindSignatureEvent(dataId) {
            const signatureBtn = document.querySelector(`.signature-btn[data-id="${dataId}"]`);
            const signatureDiv = document.getElementById(`signature${dataId}`);
            const statusElement = document.getElementById(`status${dataId}`);

            if (!signatureBtn || !signatureDiv) return;

            signatureBtn.addEventListener('click', () => {
                const userName = prompt('请输入你的姓名（整改人）：');
                if (!userName) return;
                // 模拟签字（实际项目可替换为手写签字插件）
                signatureDiv.innerHTML = `<p>✅ 整改人：${userName}（签字时间：${new Date().toLocaleString()}）</p>`;
                // 检查是否已上传整改后照片
                const postPhotoPreview = document.getElementById(`postPhotoPreview${dataId}`);
                if (postPhotoPreview.children.length > 0) {
                    statusElement.textContent = '已完成';
                    statusElement.style.color = 'green';
                    document.querySelector(`tr[data-id="${dataId}"]`).dataset.status = 'completed';
                    alert('签字成功！整改状态已更新为「已完成」');
                } else {
                    alert('签字成功，请上传整改后照片完成整改！');
                }
            });
        }

        // 初始化已有行的签字事件
        bindSignatureEvent(1);

        // -------------------------- 通用模态框关闭（点击外部） --------------------------
        window.addEventListener('click', (e) => {
            if (e.target === adminLoginModal) adminLoginModal.style.display = 'none';
            if (e.target === addHazardModal) addHazardModal.style.display = 'none';
        });
    </script>
</body>
</html>
